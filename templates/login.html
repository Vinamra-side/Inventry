<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d94b9b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Saiko"><title>Sign in · SAIKO</title><link rel="manifest" href="{{ url_for('manifest') }}"><link rel="apple-touch-icon" href="{{ url_for('static', filename='app-icon-192.png') }}"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><script src="{{ url_for('static', filename='pwa.js') }}" defer></script></head><body class="auth-page"><main class="auth-card"><img src="{{ url_for('static', filename='saiko-logo-clean.png') }}" alt="SAIKO" class="auth-logo"><div class="eyebrow">COFFEE OPERATIONS</div><h1>Sign in</h1><p class="subtitle">Use your Saiko workspace account.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash {{c}}">{{m}}</div>{% endfor %}{% endwith %}<form method="post" class="stacked"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username</label><input name="username" autocomplete="username" maxlength="80" required autofocus><label>Password</label><input name="password" type="password" autocomplete="current-password" required><button type="submit">Sign in <span>→</span></button></form></main></body></html>
