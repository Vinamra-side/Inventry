<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · SAIKO</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="auth-page"><main class="auth-card"><img src="{{ url_for('static', filename='saiko-logo-clean.png') }}" alt="SAIKO" class="auth-logo"><div class="eyebrow">COFFEE OPERATIONS</div><h1>Sign in</h1><p class="subtitle">Use your Saiko workspace account.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash {{c}}">{{m}}</div>{% endfor %}{% endwith %}<form method="post" class="stacked"><label>Username</label><input name="username" autocomplete="username" required autofocus><label>Password</label><input name="password" type="password" autocomplete="current-password" required><button type="submit">Sign in <span>→</span></button></form></main></body></html>
